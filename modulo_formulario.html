<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Inspección - Detalle</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #f4f4f9; 
            color: #333; 
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border: 2px solid #0056b3;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .header-title { 
            font-size: 15px; 
            font-weight: bold; 
            color: #0056b3; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 8px;
        }
        .school-badge {
            font-size: 11px;
            background: #eef2f7;
            padding: 3px 6px;
            border-radius: 4px;
            color: #333;
        }
        .record-id-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: #d9534f; 
            margin-bottom: 8px; 
        }
        .form-card {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }
        label { display: block; margin-top: 6px; font-weight: bold; font-size: 12px; color: #444; }
        input, select, textarea { width: 100%; padding: 6px; margin-top: 2px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        /* Carrusel de Fotos */
        .photo-carousel { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; align-items: center; }
        .photo-thumb-container { position: relative; width: 60px; height: 60px; flex-shrink: 0; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; background: #eee; }
        .photo-thumb-container img { width: 100%; height: 100%; object-fit: cover; }
        .photo-delete-btn { position: absolute; top: 1px; right: 1px; background: rgba(220,53,69,0.9); color: white; border: none; font-size: 9px; padding: 1px 4px; cursor: pointer; border-radius: 2px; }
        .photo-add-card { width: 60px; height: 60px; flex-shrink: 0; border: 2px dashed #0056b3; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: #eef2f7; cursor: pointer; font-size: 20px; color: #0056b3; }
        .photo-add-card:hover { background: #d0e1f9; }

        .btn-save { 
            background: #28a745; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-save:hover { background: #218838; }

        .btn-back { 
            background: #6c757d; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-back:hover { background: #5a6268; }

        .calc-field { background: #e9ecef; font-weight: bold; color: #0056b3; }

        table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 11px; }
        th, td { border: 1px solid #ddd; padding: 5px; text-align: left; }
        th { background: #e9ecef; }
        .btn-danger { background: #dc3545; color: white; border: none; padding: 3px 6px; border-radius: 3px; cursor: pointer; }
        
        .footer-info {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 12px;
            border-top: 1px solid #e9ecef;
            padding-top: 6px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-title">
            <span id="lblModuloTitulo">Módulo</span>
            <span class="school-badge" id="lblSchool">Escuela: ...</span>
        </div>

        <!-- ID Dinámico del Registro -->
        <div class="record-id-title" id="lblRecordId">R-1</div>

        <div class="form-card" id="camposDinamicosContainer">
            <!-- Los campos específicos de cada módulo se inyectan aquí -->
        </div>

        <!-- Carrusel de Fotografías -->
        <div class="form-card">
            <label>Fotografías del Elemento:</label>
            <div class="photo-carousel" id="carouselContainer">
                <div class="photo-add-card" onclick="document.getElementById('fileInput').click()">+</div>
            </div>
            <input type="file" id="fileInput" style="display:none;" accept="image/*" onchange="agregarFotoBorrador(event)">
        </div>

        <button class="btn-save" onclick="guardarRegistro()">➕ Agregar Registro</button>

        <!-- Tabla de Registros Guardados -->
        <div style="margin-top: 12px;">
            <strong>Registros guardados (<span id="spanTotalRegistros">0</span>)</strong>
            <div id="tablaRegistrosContainer"></div>
        </div>

        <button class="btn-back" onclick="volverMenu()">⬅️ Volver al Menú de Iconos</button>

        <div class="footer-info">
            by Jairo Ramos | v1.0
        </div>
    </div>

    <script>
        // Leer el parámetro ?mod=... enviado desde inspeccion_menu.html
        const urlParams = new URLSearchParams(window.location.search);
        const modKey = urlParams.get('mod') || 'P2';

        const schoolCode = localStorage.getItem('school_code') || '125';
        document.getElementById('lblSchool').innerText = `Escuela: ${schoolCode}`;

        // Definición completa de la estructura y campos de los 8 módulos
        const moduleConfigs = {
            'P2': {
                title: '1. Reparaciones Lineales (P2)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'length_P2', label: 'Longitud [m]', type: 'number', step: '0.01'},
                    {id: 'notes_P2', label: 'Notas', type: 'text'}
                ]
            },
            'W1': {
                title: '2. Reparación de Paredes (W1)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'length_w', label: 'Longitud [m]', type: 'number', step: '0.01'},
                    {id: 'height_w', label: 'Altura [m]', type: 'number', step: '0.01'},
                    {id: 'thickness_w', label: 'Espesor [cm]', type: 'number'},
                    {id: 'wall_Type', label: 'Material', type: 'select', options: [
                        {val: 'ConcreteBlocks', text: 'Bloque de concreto'},
                        {val: 'HollowClay', text: 'Bloque hueco de arcilla'},
                        {val: 'FullClay', text: 'Ladrillo macizo de arcilla'},
                        {val: 'LightFrame', text: 'Perfil metálico y lámina de yeso'}
                    ]},
                    {id: 'finishing', label: 'Acabado', type: 'select', options: [
                        {val: 'Plaster both wall sides', text: 'Frisada en ambas caras'},
                        {val: 'Tiles both wall sides', text: 'Cerámico en ambas caras'},
                        {val: 'One side plaster and one side tiles', text: 'Una cara frisada y otra cerámica'}
                    ]},
                    {id: 'notes_w', label: 'Notas', type: 'text'}
                ]
            },
            'P1': {
                title: '3. Frisos de Paños Mayores (P1)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'width_P1', label: 'Ancho [m]', type: 'number', step: '0.01', calc: true},
                    {id: 'length_P1', label: 'Largo [m]', type: 'number', step: '0.01', calc: true},
                    {id: 'notes_P1', label: 'Notas', type: 'text'}
                ],
                hasArea: true
            },
            'S1': {
                title: '4. Reparación de Columnas (S1)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'side1_S1', label: 'Lado 1', type: 'number'},
                    {id: 'side2_S1', label: 'Lado 2', type: 'number'},
                    {id: 'height_S1', label: 'Altura [m]', type: 'number', step: '0.01'},
                    {id: 'notes_S1', label: 'Notas', type: 'text'}
                ]
            },
            'S4': {
                title: '5. Sustitución de Columnas (S4)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'side1_S4', label: 'Lado 1', type: 'number'},
                    {id: 'side2_S4', label: 'Lado 2', type: 'number'},
                    {id: 'height_S4', label: 'Altura [m]', type: 'number', step: '0.01'},
                    {id: 'notes_column', label: 'Notas', type: 'text'}
                ]
            },
            'S5': {
                title: '6. Reparación de Vigas (S5)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'side1_S5', label: 'Lado 1', type: 'number'},
                    {id: 'side2_S5', label: 'Lado 2', type: 'number'},
                    {id: 'length_S5', label: 'Longitud [m]', type: 'number', step: '0.01'},
                    {id: 'notes_S5', label: 'Notas', type: 'text'}
                ]
            },
            'S3': {
                title: '7. Sustitución de Vigas (S3)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'side1_S3', label: 'Lado 1', type: 'number'},
                    {id: 'side2_S3', label: 'Lado 2', type: 'number'},
                    {id: 'length_S3', label: 'Longitud [m]', type: 'number', step: '0.01'},
                    {id: 'notes_S3', label: 'Notas', type: 'text'}
                ]
            },
            'F1': {
                title: '8. Daños en Pisos (F1)',
                fields: [
                    {id: 'ubicacion', label: 'Ubicación (Local/Salón)', type: 'text'},
                    {id: 'width_F1', label: 'Ancho [m]', type: 'number', step: '0.01', calc: true},
                    {id: 'length_F1', label: 'Largo [m]', type: 'number', step: '0.01', calc: true},
                    {id: 'notes_floor', label: 'Notas', type: 'text'}
                ],
                hasArea: true
            }
        };

        const currentConfig = moduleConfigs[modKey] || moduleConfigs['P2'];
        document.getElementById('lblModuloTitulo').innerText = currentConfig.title;

        // Estado local de fotos para este formulario
        let draftPhotos = [];

        // Cargar registros existentes en localStorage
        function getRegistros() {
            return JSON.parse(localStorage.getItem(`db_${modKey}`) || '[]');
        }

        function renderFormulario() {
            const container = document.getElementById('camposDinamicosContainer');
            let html = '';

            currentConfig.fields.forEach(f => {
                html += `<label>${f.label}:</label>`;
                if (f.type === 'select') {
                    html += `<select id="field_${f.id}">`;
                    f.options.forEach(opt => html += `<option value="${opt.val}">${opt.text}</option>`);
                    html += `</select>`;
                } else {
                    let extra = f.calc ? `oninput="calcularArea()"` : '';
                    html += `<input type="${f.type || 'text'}" id="field_${f.id}" ${f.step ? 'step="'+f.step+'"' : ''} ${extra}>`;
                }
            });

            if (currentConfig.hasArea) {
                html += `<label>Área Calculada [m²]:</label><input type="text" id="field_area_display" class="calc-field" readonly value="0.00">`;
            }

            container.innerHTML = html;

            // Actualizar ID dinámico correlativo (Ej: R-1, R-2)
            let regs = getRegistros();
            document.getElementById('lblRecordId').innerText = `${modKey}-R-${regs.length + 1}`;
            
            renderCarrusel();
            renderTabla();
        }

        function calcularArea() {
            if (modKey === 'P1') {
                let w = parseFloat(document.getElementById('field_width_P1').value) || 0;
                let l = parseFloat(document.getElementById('field_length_P1').value) || 0;
                document.getElementById('field_area_display').value = (w * l).toFixed(2);
            } else if (modKey === 'F1') {
                let w = parseFloat(document.getElementById('field_width_F1').value) || 0;
                let l = parseFloat(document.getElementById('field_length_F1').value) || 0;
                document.getElementById('field_area_display').value = (w * l).toFixed(2);
            }
        }

        function agregarFotoBorrador(event) {
            const files = event.target.files;
            if (files && files[0]) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    draftPhotos.push({
                        fileObj: file,
                        preview: e.target.result,
                        name: file.name
                    });
                    renderCarrusel();
                };
                reader.readAsDataURL(file);
            }
        }

        function eliminarFotoBorrador(index) {
            draftPhotos.splice(index, 1);
            renderCarrusel();
        }

        function renderCarrusel() {
            const container = document.getElementById('carouselContainer');
            let html = '';
            draftPhotos.forEach((photo, idx) => {
                html += `<div class="photo-thumb-container">
                    <img src="${photo.preview}" alt="Foto">
                    <button class="photo-delete-btn" onclick="eliminarFotoBorrador(${idx})">✕</button>
                </div>`;
            });
            html += `<div class="photo-add-card" onclick="document.getElementById('fileInput').click()">+</div>`;
            container.innerHTML = html;
        }

        function guardarRegistro() {
            let regs = getRegistros();
            let seq = regs.length + 1;
            let idString = `R-${seq}`;

            let nuevoRegistro = {};
            
            // Asignar ID según nomenclatura del módulo
            if (modKey === 'P2') nuevoRegistro.P2_Number = idString;
            if (modKey === 'W1') nuevoRegistro.W1_Number = idString;
            if (modKey === 'P1') nuevoRegistro.P1_Number = idString;
            if (modKey === 'S1') nuevoRegistro.column_Number = idString;
            if (modKey === 'S4') nuevoRegistro.column_Replacement = idString;
            if (modKey === 'S5') nuevoRegistro.beam_Cover_Number = idString;
            if (modKey === 'S3') nuevoRegistro.beam_Number = idString;
            if (modKey === 'F1') nuevoRegistro.floor_Number = idString;

            let ubicacionVal = document.getElementById('field_ubicacion').value;
            if (!ubicacionVal) {
                alert("Por favor indique la ubicación.");
                return;
            }
            nuevoRegistro.ubicacion = ubicacionVal;

            currentConfig.fields.forEach(f => {
                if (f.id === 'ubicacion') return;
                let el = document.getElementById(`field_${f.id}`);
                if (el) {
                    nuevoRegistro[f.id] = el.type === 'number' ? parseFloat(el.value) || 0 : el.value;
                }
            });

            if (modKey === 'P1') nuevoRegistro.area_PC_P1 = parseFloat(document.getElementById('field_area_display').value) || 0;
            if (modKey === 'F1') nuevoRegistro.floor_area = parseFloat(document.getElementById('field_area_display').value) || 0;

            // Procesar nombres de fotos
            let fotoNombres = [];
            draftPhotos.forEach((item, idx) => {
                let formattedName = `${schoolCode}_${modKey}_${idString}-${idx+1}.jpg`;
                fotoNombres.push(formattedName);
            });

            let imgKey = {'P2':'P2_Image', 'W1':'wall_image', 'P1':'P1_Image', 'S1':'S1_Image', 'S4':'column_Image', 'S5':'S5_Image', 'S3':'S3_Image', 'F1':'floor_Image'}[modKey];
            nuevoRegistro[imgKey] = fotoNombres;
            
            // Guardar objetos de archivos en base64 para poder exportarlos luego en el ZIP
            nuevoRegistro.rawFiles = draftPhotos.map((p, idx) => ({
                name: `${schoolCode}_${modKey}_${idString}-${idx+1}.jpg`,
                preview: p.preview
            }));

            regs.push(nuevoRegistro);
            localStorage.setItem(`db_${modKey}`, JSON.stringify(regs));

            // Limpiar borrador de fotos y recargar formulario
            draftPhotos = [];
            renderFormulario();
            alert("¡Registro guardado con éxito!");
        }

        function renderTabla() {
            let regs = getRegistros();
            document.getElementById('spanTotalRegistros').innerText = regs.length;
            const container = document.getElementById('tablaRegistrosContainer');

            if (regs.length === 0) {
                container.innerHTML = `<p style="font-size:11px; color:#666;">No hay registros guardados.</p>`;
                return;
            }

            let html = `<table><tr><th>ID</th><th>Ubicación</th><th>Fotos</th><th>Acción</th></tr>`;
            regs.forEach((r, index) => {
                let idKey = Object.keys(r).find(k => k.includes('Number') || k.includes('Replacement'));
                let imgCount = (r.rawFiles || []).length;
                html += `<tr>
                    <td><b>${r[idKey]}</b></td>
                    <td>${r.ubicacion}</td>
                    <td>${imgCount} foto(s)</td>
                    <td><button class="btn-danger" onclick="eliminarRegistro(${index})">🗑️</button></td>
                </tr>`;
            });
            html += `</table>`;
            container.innerHTML = html;
        }

        function eliminarRegistro(index) {
            if(confirm("¿Desea eliminar este registro?")) {
                let regs = getRegistros();
                regs.splice(index, 1);
                localStorage.setItem(`db_${modKey}`, JSON.stringify(regs));
                renderFormulario();
            }
        }

        function volverMenu() {
            window.location.href = "inspeccion_menu.html";
        }

        // Inicializar al cargar la página
        renderFormulario();
    </script>
</body>
</html>
