<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspecciones detalladas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2a64ad">
    <link rel="apple-touch-icon" href="icono-192.png">
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: #f4f4f9; 
            color: #333; 
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border: 2px solid #204b77;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .header-title { 
            font-size: 20px; 
            color: #000; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        .header-title img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .header-title span {
            font-weight: 500;
        }
        
        .table-container {
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            margin-bottom: 25px;
            min-height: 200px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 8px;
            font-size: 14px;
        }
        th {
            background-color: #e9eff5;
            color: #2c4a6b;
            font-weight: bold;
            border-bottom: 1px solid #dcdcdc;
        }
        th:first-child { border-top-left-radius: 6px; }
        th:last-child { border-top-right-radius: 6px; text-align: center; }
        td:last-child { text-align: center; }
        td {
            border-bottom: 1px solid #f1f1f1;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty-message {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 60px 20px;
        }
        .btn-dots {
            background: transparent;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
            padding: 0 8px;
            border-radius: 4px;
        }
        .btn-dots:hover {
            background-color: #e9eff5;
            color: #2a64ad;
        }

        .btn-primary { 
            background: #2a64ad; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #1f4b82; }

        .footer-info {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }

        /* Estilos del Modal */
        #modalOpciones {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #204b77;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 10px;
        }
        .modal-subtitle {
            font-size: 14px;
            color: #444;
            text-align: center;
            font-weight: 500;
            background: #f4f4f9;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-btn-view {
            background: #2a64ad;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-btn-view:hover { background: #1f4b82; }
        
        .modal-btn-edit {
            background: #e2e8f0;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-btn-edit:hover { background: #cbd5e1; }

        .modal-btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-btn-delete:hover { background: #bb2d3b; }

        .modal-btn-cancel {
            background: #f1f1f1;
            color: #555;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .modal-btn-cancel:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header-title">
            <img src="logo.png" alt="Logo" onerror="this.src='icono-192.png'">
            <span>Inspecciones detalladas</span>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Edificio/Casa</th>
                        <th>Nro.</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="inspeccionesBody">
                    <tr>
                        <td colspan="4" class="empty-message">Cargando inspecciones...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button class="btn-primary" onclick="crearNuevaInspeccion()">+ Inspección</button>

        <div class="footer-info">
            by Jairo Ramos | <span id="versionText">Cargando...</span>
        </div>       
    </div>

    <!-- Modal de Opciones -->
    <div id="modalOpciones">
        <div class="modal-card">
            <div class="modal-title">Opciones de Registro</div>
            <div id="modalInstitutionName" class="modal-subtitle">Institución / Código</div>
            <div class="modal-buttons">
                <button class="modal-btn-view" onclick="ejecutarAccionModal('ver')">👁️ Ver Resumen</button>
                <button class="modal-btn-edit" onclick="ejecutarAccionModal('editar')">✏️ Editar Registro</button>
                <button class="modal-btn-delete" onclick="ejecutarAccionModal('eliminar')">🗑️ Eliminar Registro</button>
                <button class="modal-btn-cancel" onclick="cerrarModalOpciones()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>

    <script>
        let selectedInspectionId = null;

        // ==========================================
        // CONFIGURACIÓN CENTRALIZADA DE INDEXEDDB
        // ==========================================
        const DB_NAME = 'InspeccionAppDB';
        const DB_VERSION = 4; // Subimos a 4 en TODOS los archivos para forzar reparación
        let dbInstance = null;

        // Lista maestra de todos los almacenes de módulos (Object Stores)
        // Esto asegura que sin importar por qué archivo entre el usuario,
        // se creen todas las tablas requeridas.
        const APP_MODULE_STORES = ['P1','P2', 'W1', 'F1', 'S1', 'S2','S3', 'S4', 'S5'];

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                // 1. EVENTO DE MIGRACIÓN/CREACIÓN
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    console.log(`[IndexedDB] Migrando a la versión ${e.newVersion}...`);

                    // Verificamos y creamos de forma segura las tablas de módulos
                    APP_MODULE_STORES.forEach(storeName => {
                        if (!db.objectStoreNames.contains(storeName)) {
                            db.createObjectStore(storeName, { keyPath: 'internal_id', autoIncrement: true });
                            console.log(`[IndexedDB] Almacén '${storeName}' creado exitosamente.`);
                        }
                    });

                    // Verificamos y creamos de forma segura la tabla principal
                    if (!db.objectStoreNames.contains('tbInspecciones')) {
                        db.createObjectStore('tbInspecciones', { keyPath: 'id_inspeccion' });
                        console.log(`[IndexedDB] Almacén 'tbInspecciones' creado exitosamente.`);
                    }
                };

                // 2. EVENTO DE ÉXITO
                request.onsuccess = (e) => {
                    dbInstance = e.target.result;

                    // Manejador vital: Si otra pestaña intenta actualizar la versión de la DB,
                    // cerramos nuestra conexión para no bloquear la actualización y avisamos.
                    dbInstance.onversionchange = () => {
                        dbInstance.close();
                        console.warn("[IndexedDB] Base de datos desactualizada. Se requiere recargar la página.");
                    };

                    resolve(dbInstance);
                };

                // 3. MANEJO DE ERRORES (ej. VersionError)
                request.onerror = (e) => {
                    console.error('[IndexedDB] Error crítico al abrir la base de datos:', e.target.error);
                    reject(e.target.error);
                };

                // 4. PREVENCIÓN DE CONGELAMIENTO
                request.onblocked = (e) => {
                    console.warn('[IndexedDB] Conexión bloqueada. Hay pestañas abiertas con versiones anteriores.');
                    alert("Atención: Por favor cierra las otras pestañas de esta aplicación para permitir la actualización de la base de datos.");
                };
            });
        }

        async function cargarInspecciones() {
            if (!dbInstance) await initDB();
            return new Promise((resolve, reject) => {
                if (!dbInstance.objectStoreNames.contains('tbInspecciones')) {
                    resolve([]);
                    return;
                }
                const tx = dbInstance.transaction('tbInspecciones', 'readonly');
                const store = tx.objectStore('tbInspecciones');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        async function mostrarInspecciones() {
            const tbody = document.getElementById('inspeccionesBody');
            try {
                const inspecciones = await cargarInspecciones();
                
                if (inspecciones.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-message">No hay inspecciones registradas aún...</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '';
                
                // Sort by date (descending) or by consecutive number
                inspecciones.sort((a, b) => {
                    return parseInt(b.school_code || 0) - parseInt(a.school_code || 0);
                });

                inspecciones.forEach(insp => {
                    const tr = document.createElement('tr');
                    
                    const tdFecha = document.createElement('td');
                    tdFecha.textContent = insp.fecha || '-';
                    
                    const tdNombre = document.createElement('td');
                    tdNombre.textContent = insp.school_name && insp.school_name !== 'Nueva Institución' 
                                            ? insp.school_name 
                                            : 'Sin configurar';
                    
                    const tdNro = document.createElement('td');
                    tdNro.textContent = insp.school_code || '-';

                    const tdAcciones = document.createElement('td');
                    const btnDots = document.createElement('button');
                    btnDots.className = 'btn-dots';
                    btnDots.textContent = '⋮';
                    btnDots.title = 'Opciones';
                    btnDots.onclick = (e) => abrirModalOpciones(insp, e);
                    tdAcciones.appendChild(btnDots);
                    
                    tr.appendChild(tdFecha);
                    tr.appendChild(tdNombre);
                    tr.appendChild(tdNro);
                    tr.appendChild(tdAcciones);
                    
                    tbody.appendChild(tr);
                });
                
            } catch (error) {
                console.error("Error cargando inspecciones:", error);
                tbody.innerHTML = '<tr><td colspan="4" class="empty-message">Error al cargar inspecciones</td></tr>';
            }
        }

        function abrirModalOpciones(insp, event) {
            if (event) event.stopPropagation();
            selectedInspectionId = insp.id_inspeccion;
            
            const nombreInst = insp.school_name && insp.school_name !== 'Nueva Institución' 
                                ? insp.school_name 
                                : 'Sin configurar';
            const codigoInst = insp.school_code || '-';
            
            document.getElementById('modalInstitutionName').textContent = `${nombreInst} (Nro: ${codigoInst})`;
            document.getElementById('modalOpciones').style.display = 'flex';
        }

        function cerrarModalOpciones() {
            document.getElementById('modalOpciones').style.display = 'none';
            selectedInspectionId = null;
        }

        function ejecutarAccionModal(accion) {
            if (!selectedInspectionId) return;

            if (accion === 'ver' || accion === 'editar') {
                localStorage.setItem('active_id_inspeccion', selectedInspectionId);
                window.location.href = "inspeccion_menu.html";
            } else if (accion === 'eliminar') {
                if (confirm("¿Está seguro de eliminar esta inspección permanentemente?")) {
                    eliminarInspeccion(selectedInspectionId);
                }
            }
            cerrarModalOpciones();
        }

        async function eliminarInspeccion(id) {
            try {
                const tx = dbInstance.transaction('tbInspecciones', 'readwrite');
                const store = tx.objectStore('tbInspecciones');
                const req = store.delete(id);
                
                req.onsuccess = () => {
                    mostrarInspecciones();
                };
                req.onerror = () => {
                    alert("No se pudo eliminar el registro. Intente nuevamente.");
                };
            } catch (error) {
                console.error("Error al eliminar la inspección:", error);
            }
        }

        async function crearNuevaInspeccion() {
            try {
                const inspecciones = await cargarInspecciones();
                
                let maxNro = 0;
                inspecciones.forEach(insp => {
                    const num = parseInt(insp.school_code);
                    if (!isNaN(num) && num > maxNro) {
                        maxNro = num;
                    }
                });
                const nuevoNro = (maxNro + 1).toString();
                
                const timestamp = new Date().getTime();
                const id_inspeccion = 'insp_' + timestamp;
                
                const hoy = new Date();
                const fechaStr = hoy.toISOString().split('T')[0];
                
                const nuevaInsp = {
                    id_inspeccion: id_inspeccion,
                    school_code: nuevoNro,
                    school_name: 'Nueva Institución',
                    direccion: '',
                    inspectors: [],
                    foto_instituto: null,
                    estado_config: 'pendiente',
                    fecha: fechaStr,
                    nombre_inspeccion: `Insp. [${nuevoNro}] - ${fechaStr}`,
                    estado: 'activa'
                };

                const tx = dbInstance.transaction('tbInspecciones', 'readwrite');
                const req = tx.objectStore('tbInspecciones').add(nuevaInsp);
                
                req.onsuccess = () => {
                    localStorage.setItem('active_id_inspeccion', id_inspeccion);
                    window.location.href = "inspeccion_menu.html";
                };
                req.onerror = () => {
                    console.error("Error al crear la nueva inspección");
                    alert("No se pudo crear la nueva inspección. Intente nuevamente.");
                };
            } catch (error) {
                console.error("Error general al crear inspección:", error);
            }
        }

        window.addEventListener('load', () => {
            mostrarInspecciones();
        });

        // PWA Setup & Updates
        let newWorker;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                verificarNovedades();
                            }
                        });
                    });
                }).catch(err => console.error('Error SW:', err));
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }
        
        function verificarNovedades() {
            fetch('./novedades.json?t=' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    let titulo = data.titulo || "Actualización del Sistema";
                    let version = data.version || "Actual";
                    let fecha = data.fecha || "";
                    let cambios = data.cambios || ["Mejoras generales y correcciones."];
                    let mensaje = `🚀 ¡${titulo} (v${version})!\nFecha: ${fecha}\n\nNovedades:\n`;
                    cambios.forEach((cambio) => {
                        mensaje += `• ${cambio}\n`;
                    });
                    mensaje += "\n¿Desea actualizar el sistema ahora?";
                    if(confirm(mensaje)) {
                        if(newWorker) newWorker.postMessage({ action: 'skipWaiting' });
                    }
                })
                .catch((error) => {
                    console.error("No se pudo leer novedades.json:", error);
                    let mensajeRespaldo = "🚀 ¡Nueva actualización disponible!\n\n¿Desea actualizar el sistema ahora?";
                    if(confirm(mensajeRespaldo)) {
                        if(newWorker) newWorker.postMessage({ action: 'skipWaiting' >>> 'skipWaiting' });
                    }
                });
        }
    </script>
</body>
</html>
