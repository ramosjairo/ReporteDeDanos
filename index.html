<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspecciones detalladas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2a64ad">
    <link rel="apple-touch-icon" href="icono-192.png">
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: #f4f4f9; 
            color: #333; 
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border: 2px solid #204b77;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .header-title { 
            font-size: 20px; 
            color: #000; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        .header-title img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .header-title span {
            font-weight: 500;
        }
        
        .table-container {
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            margin-bottom: 25px;
            min-height: 200px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px;
            font-size: 14px;
        }
        th {
            background-color: #e9eff5;
            color: #2c4a6b;
            font-weight: bold;
            border-bottom: 1px solid #dcdcdc;
        }
        th:first-child { border-top-left-radius: 6px; }
        th:last-child { border-top-right-radius: 6px; text-align: center; }
        td:last-child { text-align: center; }
        td {
            border-bottom: 1px solid #f1f1f1;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr.clickable {
            cursor: pointer;
            transition: background 0.2s;
        }
        tr.clickable:hover {
            background-color: #f9f9f9;
        }
        .empty-message {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 60px 20px;
        }

        .btn-primary { 
            background: #2a64ad; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #1f4b82; }

        .footer-info {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header-title">
            <img src="logo.png" alt="Logo" onerror="this.src='icono-192.png'">
            <span>Inspecciones detalladas</span>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Edificio/Casa</th>
                        <th>Nro.</th>
                    </tr>
                </thead>
                <tbody id="inspeccionesBody">
                    <tr>
                        <td colspan="3" class="empty-message">Cargando inspecciones...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button class="btn-primary" onclick="crearNuevaInspeccion()">+ Inspección</button>

        <div class="footer-info">
            by Jairo Ramos | <span id="versionText">Cargando...</span>
        </div>       
    </div>

    <script src="global.js"></script>

    <script>
        // IndexedDB Configuration
        const DB_NAME = 'InspeccionAppDB';
        const DB_VERSION = 2;
        let dbInstance = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('tbInspecciones')) {
                        db.createObjectStore('tbInspecciones', { keyPath: 'id_inspeccion' });
                    }
                };
                request.onsuccess = () => {
                    dbInstance = request.result;
                    resolve(dbInstance);
                };
                request.onerror = () => reject(request.error);
            });
        }

        async function cargarInspecciones() {
            if (!dbInstance) await initDB();
            return new Promise((resolve, reject) => {
                if (!dbInstance.objectStoreNames.contains('tbInspecciones')) {
                    resolve([]);
                    return;
                }
                const tx = dbInstance.transaction('tbInspecciones', 'readonly');
                const store = tx.objectStore('tbInspecciones');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        async function mostrarInspecciones() {
            const tbody = document.getElementById('inspeccionesBody');
            try {
                const inspecciones = await cargarInspecciones();
                
                if (inspecciones.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="empty-message">No hay inspecciones registradas aún...</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '';
                
                // Sort by date (descending) or by consecutive number
                inspecciones.sort((a, b) => {
                    return parseInt(b.school_code || 0) - parseInt(a.school_code || 0);
                });

                inspecciones.forEach(insp => {
                    const tr = document.createElement('tr');
                    tr.className = 'clickable';
                    tr.onclick = () => seleccionarEIrAInspeccion(insp.id_inspeccion);
                    
                    const tdFecha = document.createElement('td');
                    tdFecha.textContent = insp.fecha || '-';
                    
                    const tdNombre = document.createElement('td');
                    tdNombre.textContent = insp.school_name && insp.school_name !== 'Nueva Institución' 
                                            ? insp.school_name 
                                            : 'Sin configurar';
                    
                    const tdNro = document.createElement('td');
                    tdNro.textContent = insp.school_code || '-';
                    
                    tr.appendChild(tdFecha);
                    tr.appendChild(tdNombre);
                    tr.appendChild(tdNro);
                    
                    tbody.appendChild(tr);
                });
                
            } catch (error) {
                console.error("Error cargando inspecciones:", error);
                tbody.innerHTML = '<tr><td colspan="3" class="empty-message">Error al cargar inspecciones</td></tr>';
            }
        }

        function seleccionarEIrAInspeccion(id_inspeccion) {
            localStorage.setItem('active_id_inspeccion', id_inspeccion);
            window.location.href = "inspeccion_menu.html";
        }

        async function crearNuevaInspeccion() {
            try {
                const inspecciones = await cargarInspecciones();
                
                // Calcular un nuevo número consecutivo
                let maxNro = 0;
                inspecciones.forEach(insp => {
                    const num = parseInt(insp.school_code);
                    if (!isNaN(num) && num > maxNro) {
                        maxNro = num;
                    }
                });
                const nuevoNro = (maxNro + 1).toString();
                
                const timestamp = new Date().getTime();
                const id_inspeccion = 'insp_' + timestamp;
                
                const hoy = new Date();
                const fechaStr = hoy.toISOString().split('T')[0];
                
                const nuevaInsp = {
                    id_inspeccion: id_inspeccion,
                    school_code: nuevoNro,
                    school_name: 'Nueva Institución',
                    direccion: '',
                    inspectors: [],
                    foto_instituto: null,
                    estado_config: 'pendiente',
                    fecha: fechaStr,
                    nombre_inspeccion: `Insp. [${nuevoNro}] - ${fechaStr}`,
                    estado: 'activa'
                };

                const tx = dbInstance.transaction('tbInspecciones', 'readwrite');
                const req = tx.objectStore('tbInspecciones').add(nuevaInsp);
                
                req.onsuccess = () => {
                    seleccionarEIrAInspeccion(id_inspeccion);
                };
                req.onerror = () => {
                    console.error("Error al crear la nueva inspección");
                    alert("No se pudo crear la nueva inspección. Intente nuevamente.");
                };
            } catch (error) {
                console.error("Error general al crear inspección:", error);
            }
        }

        window.addEventListener('load', () => {
            mostrarInspecciones();
        });

        // PWA Setup & Updates
        let newWorker;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                verificarNovedades();
                            }
                        });
                    });
                }).catch(err => console.error('Error SW:', err));
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }
        
        function verificarNovedades() {
            fetch('./novedades.json?t=' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    let titulo = data.titulo || "Actualización del Sistema";
                    let version = data.version || "Actual";
                    let fecha = data.fecha || "";
                    let cambios = data.cambios || ["Mejoras generales y correcciones."];
                    let mensaje = `🚀 ¡${titulo} (v${version})!\nFecha: ${fecha}\n\nNovedades:\n`;
                    cambios.forEach((cambio) => {
                        mensaje += `• ${cambio}\n`;
                    });
                    mensaje += "\n¿Desea actualizar el sistema ahora?";
                    if(confirm(mensaje)) {
                        if(newWorker) newWorker.postMessage({ action: 'skipWaiting' });
                    }
                })
                .catch((error) => {
                    console.error("No se pudo leer novedades.json:", error);
                    let mensajeRespaldo = "🚀 ¡Nueva actualización disponible!\n\n¿Desea actualizar el sistema ahora?";
                    if(confirm(mensajeRespaldo)) {
                        if(newWorker) newWorker.postMessage({ action: 'skipWaiting' });
                    }
                });
        }
    </script>
</body>
</html>
